name: dark-validate
description: Project-level validation DAG with split fast deterministic gate and qualitative human review
internal: true
model: medium
inputs:
  scope:
    type: string
    description: Optional submodule path or scope (e.g. plugin/trino-mongodb)
  target_branch:
    type: string
    description: Target base branch for commit inspection (default master)
    default: master
returns: qualitative-review
outcome_field: green

nodes:
  - id: deterministic-gate
    type: bash
    inputs:
      scope: inputs.scope
      target_branch: inputs.target_branch
    env:
      SCOPE: inputs.scope
      TARGET_BRANCH: inputs.target_branch
    command: |
      set -eo pipefail

      TARGET_BRANCH="${TARGET_BRANCH:-master}"
      SCOPE="${SCOPE:-}"
      ARTIFACTS_DIR="${ARTIFACTS_DIR:-$PWD/artifacts}"
      mkdir -p "$ARTIFACTS_DIR"

      VAL_MD="$ARTIFACTS_DIR/validation.md"
      GATE_JSON="$ARTIFACTS_DIR/gate-summary.json"

      ERRORS=()

      # Step 1: Trailing Newlines Verification
      echo "=== Step 1: Trailing Newlines Verification ==="
      BASE_REF="origin/$TARGET_BRANCH"
      if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
        BASE_REF="$TARGET_BRANCH"
      fi

      DIFF_BASE=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || echo "$BASE_REF")
      MODIFIED_FILES=$(git diff --name-only "$DIFF_BASE" HEAD 2>/dev/null || true)

      TRAILING_NL_FAILED=()
      while IFS= read -r file; do
        [ -z "$file" ] && continue
        if [ -f "$file" ]; then
          # Check if last byte is newline
          if [ -s "$file" ]; then
            LAST_BYTE=$(tail -c 1 "$file" | od -An -tx1 | tr -d ' \n')
            if [ "$LAST_BYTE" != "0a" ]; then
              TRAILING_NL_FAILED+=("$file")
            fi
          fi
        fi
      done <<< "$MODIFIED_FILES"

      if [ ${#TRAILING_NL_FAILED[@]} -gt 0 ]; then
        ERRORS+=("Missing trailing newline in files: ${TRAILING_NL_FAILED[*]}")
        echo "FAIL: Trailing newline check failed on: ${TRAILING_NL_FAILED[*]}"
      else
        echo "PASS: Trailing newline check clean."
      fi

      # Step 2: Airlift Commit Message Structure
      echo "=== Step 2: Airlift Commit Message Structure ==="
      COMMITS=$(git rev-list "$DIFF_BASE..HEAD" 2>/dev/null || git rev-list -n 1 HEAD)
      COMMIT_ERRORS=()

      for commit in $COMMITS; do
        SUBJECT=$(git log -1 --format="%s" "$commit")
        BODY=$(git log -1 --format="%b" "$commit")

        # Subject length <= 60 chars (hard limit)
        SUBJECT_LEN=${#SUBJECT}
        if [ "$SUBJECT_LEN" -gt 60 ]; then
          COMMIT_ERRORS+=("Commit $commit subject exceeds 60 characters (actual: $SUBJECT_LEN)")
        fi

        # Subject begins with capital letter or Component: prefix
        if ! [[ "$SUBJECT" =~ ^[A-Z] ]]; then
          COMMIT_ERRORS+=("Commit $commit subject must begin with a capital letter (subject: '$SUBJECT')")
        fi

        # Subject must not end with a period
        if [[ "$SUBJECT" =~ \.$ ]]; then
          COMMIT_ERRORS+=("Commit $commit subject must not end with a period (subject: '$SUBJECT')")
        fi

        # Imperative mood check for initial word
        FIRST_WORD=$(echo "$SUBJECT" | awk '{print $1}' | tr -d ':,')
        if [[ "$FIRST_WORD" =~ (Added|Fixed|Updated|Removed|Changed|Implemented|Resolved) ]]; then
          COMMIT_ERRORS+=("Commit $commit uses past-tense verb '$FIRST_WORD'; imperative mood required")
        fi

        # Body line length <= 72 chars
        if [ -n "$BODY" ]; then
          LINE_NUM=0
          while IFS= read -r line; do
            LINE_NUM=$((LINE_NUM + 1))
            # Ignore empty lines, URLs or Signed-off-by trailers in length constraint
            if [[ "$line" =~ ^Signed-off-by: ]] || [[ "$line" =~ https?:// ]]; then
              continue
            fi
            if [ ${#line} -gt 72 ]; then
              COMMIT_ERRORS+=("Commit $commit body line $LINE_NUM exceeds 72 characters (length: ${#line})")
              break
            fi
          done <<< "$BODY"
        fi
      done

      if [ ${#COMMIT_ERRORS[@]} -gt 0 ]; then
        for ce in "${COMMIT_ERRORS[@]}"; do
          ERRORS+=("$ce")
          echo "FAIL: $ce"
        done
      else
        echo "PASS: Commit message structure clean."
      fi

      # Step 3: PR Link & Structural Rules
      echo "=== Step 3: PR Link & Structural Rules ==="
      PR_BODY=""
      if command -v gh >/dev/null 2>&1; then
        PR_BODY=$(gh pr view --json body -q .body 2>/dev/null || true)
      fi
      if [ -z "$PR_BODY" ] && [ -f "$ARTIFACTS_DIR/pr-description.md" ]; then
        PR_BODY=$(cat "$ARTIFACTS_DIR/pr-description.md")
      fi
      if [ -z "$PR_BODY" ]; then
        PR_BODY=$(git log -1 --format="%b" HEAD 2>/dev/null || true)
      fi

      if [ -n "$PR_BODY" ]; then
        # Capitalization check on first non-empty line
        FIRST_NON_EMPTY=$(echo "$PR_BODY" | grep -v '^[[:space:]]*$' | head -n 1 || true)
        if [ -n "$FIRST_NON_EMPTY" ] && ! [[ "$FIRST_NON_EMPTY" =~ ^[[:space:]]*([A-Z]|#) ]]; then
          ERRORS+=("PR description must start with a capital letter")
          echo "FAIL: PR description does not start with a capital letter"
        fi

        # Issue closing directives on bulleted list items only
        # Look for fixes #123, closes #123, resolves #123 that are NOT preceded by - or *
        while IFS= read -r line; do
          if [[ "$line" =~ (fixes|closes|resolves)[[:space:]]+#[0-9]+ ]]; then
            if ! [[ "$line" =~ ^[[:space:]]*[-*][[:space:]] ]]; then
              ERRORS+=("Issue-closing directives (e.g. closes #123) must reside on bulleted list items starting with '-' or '*'")
              echo "FAIL: Issue-closing directive found outside bulleted item: $line"
              break
            fi
          fi
        done <<< "$PR_BODY"
      fi

      # Step 4: Module Auto-Discovery
      echo "=== Step 4: Module Auto-Discovery ==="
      TARGET_MODULE="$SCOPE"
      if [ -z "$TARGET_MODULE" ]; then
        # Detect from modified files
        DETECTED_MODULES=$(echo "$MODIFIED_FILES" | grep -E '^(plugin|core|lib|client)/' | cut -d/ -f1-2 | sort -u || true)
        COUNT=$(echo "$DETECTED_MODULES" | grep -c . || true)
        if [ "$COUNT" -eq 1 ]; then
          TARGET_MODULE="$DETECTED_MODULES"
          echo "Auto-detected target module: $TARGET_MODULE"
        elif [ "$COUNT" -gt 1 ]; then
          echo "Multiple modules modified: $DETECTED_MODULES"
          # Take first or combine with comma
          TARGET_MODULE=$(echo "$DETECTED_MODULES" | tr '\n' ',' | sed 's/,$//')
        fi
      fi

      # Check if any Java or POM files were changed
      JAVA_OR_POM_CHANGED=false
      if echo "$MODIFIED_FILES" | grep -qE '(\.java$|pom\.xml$)'; then
        JAVA_OR_POM_CHANGED=true
      fi

      TESTS_RUN=()
      if [ "$JAVA_OR_POM_CHANGED" = true ] && [ -n "$TARGET_MODULE" ]; then
        echo "=== Step 5: Scoped Fast Maven Checks for module: $TARGET_MODULE ==="

        # Airstyle check
        echo "Running airstyle check..."
        if ! ./mvnw airstyle:check -pl "$TARGET_MODULE"; then
          ERRORS+=("Airstyle check failed on $TARGET_MODULE")
        fi

        # License check
        echo "Running license check..."
        if ! ./mvnw license:check -pl "$TARGET_MODULE"; then
          ERRORS+=("License check failed on $TARGET_MODULE")
        fi

        # POM verify
        echo "Running sortpom verify..."
        if ! ./mvnw sortpom:verify -pl "$TARGET_MODULE"; then
          ERRORS+=("POM sort verification failed on $TARGET_MODULE")
        fi

        # Error Prone compile with -am invariant
        echo "Running Error Prone test-compile..."
        if ! ./mvnw clean test-compile -Dair.check.skip-all=true -P errorprone-compiler -pl "$TARGET_MODULE" -am; then
          ERRORS+=("Error Prone test-compile failed on $TARGET_MODULE")
        fi

        # Scoped In-Memory Unit Tests
        echo "Running scoped unit tests..."
        # Discover changed test classes
        CHANGED_TESTS=$(echo "$MODIFIED_FILES" | grep -E '(Test[^/]*\.java|[^/]*Test\.java)$' | xargs -r -n1 basename | sed 's/\.java$//' | grep -vE '(Smoke|QueryRunner|Container|Integration)' | tr '\n' ',' | sed 's/,$//' || true)

        TEST_ARG=""
        if [ -n "$CHANGED_TESTS" ]; then
          TEST_ARG="-Dtest=$CHANGED_TESTS"
          TESTS_RUN+=("$CHANGED_TESTS")
        elif [ "$TARGET_MODULE" = "plugin/trino-mongodb" ]; then
          # Safe fallback pure unit tests
          TEST_ARG="-Dtest=TestMongoClientConfig,TestMongoSessionProperties,TestMongoTableHandle,TestMongoSplit"
          TESTS_RUN+=("TestMongoClientConfig,TestMongoSessionProperties,TestMongoTableHandle,TestMongoSplit")
        fi

        if [ -n "$TEST_ARG" ]; then
          echo "Executing test command: ./mvnw test -Dair.check.skip-all=true -pl $TARGET_MODULE -am $TEST_ARG"
          if ! ./mvnw test -Dair.check.skip-all=true -pl "$TARGET_MODULE" -am "$TEST_ARG"; then
            ERRORS+=("Unit tests execution failed: $TEST_ARG")
          fi
        else
          echo "No targeted in-memory unit tests identified for module: $TARGET_MODULE"
        fi
      else
        echo "No Java/POM modifications detected in scoped modules; skipping Maven test-compile and test runs."
      fi

      # Step 6: Artifacts Generation
      echo "=== Step 6: Artifact Generation ==="
      if [ ${#ERRORS[@]} -eq 0 ]; then
        GATE_STATUS="passed"
        {
          echo "# Validation Report"
          echo ""
          echo "## Status"
          echo "PASSED"
          echo ""
          echo "## Summary"
          echo "All deterministic checks completed with clean status."
          echo "- Trailing newline verification: SUCCESS"
          echo "- Commit message format verification: SUCCESS"
          echo "- PR link and structure verification: SUCCESS"
          echo "- Scoped module build and unit tests: SUCCESS"
          echo ""
        } > "$VAL_MD"
        if [ ${#TESTS_RUN[@]} -gt 0 ]; then
          echo "Tests verified: ${TESTS_RUN[*]}" >> "$VAL_MD"
        fi
      else
        GATE_STATUS="failed"
        {
          echo "# Validation Report"
          echo ""
          echo "## Status"
          echo "FAILED"
          echo ""
          echo "## Summary"
          echo "Validation encountered the following issues:"
          for err in "${ERRORS[@]}"; do
            echo "- $err"
          done
        } > "$VAL_MD"
      fi

      # Format gate-summary.json safely using python3 if available, or printf
      if command -v python3 >/dev/null 2>&1; then
        python3 -c "import json, sys, os; status = sys.argv[1]; module = sys.argv[2]; tests = [t for t in sys.argv[3].split(',') if t]; body = sys.argv[4]; errors = [e for e in sys.argv[5].split(';;') if e]; out_path = sys.argv[6]; payload = {'gate_status': status, 'module': module, 'tests_run': tests, 'pr_body': body, 'errors': errors}; open(out_path, 'w', encoding='utf-8').write(json.dumps(payload, indent=2))" "$GATE_STATUS" "$TARGET_MODULE" "${TESTS_RUN[*]}" "$PR_BODY" "$(IFS=';;'; echo "${ERRORS[*]}")" "$GATE_JSON"
      else
        {
          echo "{"
          echo "  \"gate_status\": \"$GATE_STATUS\","
          echo "  \"module\": \"$TARGET_MODULE\","
          echo "  \"tests_run\": [\"${TESTS_RUN[*]}\"],"
          echo "  \"pr_body\": $(echo "$PR_BODY" | jq -Rs . 2>/dev/null || echo '""'),"
          echo "  \"errors\": $(printf '%s\n' "${ERRORS[@]}" | jq -R . | jq -s . 2>/dev/null || echo '[]')"
          echo "}"
        } > "$GATE_JSON"
      fi

      echo "Deterministic gate completed with status: $GATE_STATUS"
      if [ "$GATE_STATUS" != "passed" ]; then
        exit 1
      fi

  - id: qualitative-review
    type: prompt
    depends_on: [deterministic-gate]
    trigger_rule: all_done
    output_type: validation
    prompt: |
      You are conducting a qualitative review and synthesizing the final validation verdict for a Trino pull request.

      Input deterministic gate summary:
      File: $ARTIFACTS_DIR/gate-summary.json
      {{#file_exists "$ARTIFACTS_DIR/gate-summary.json"}}
      {{cat "$ARTIFACTS_DIR/gate-summary.json"}}
      {{/file_exists}}

      PR Description Context:
      {{#file_exists "$ARTIFACTS_DIR/pr-description.md"}}
      {{cat "$ARTIFACTS_DIR/pr-description.md"}}
      {{/file_exists}}

      Review Directives:
      1. Deterministic Status Audit:
         - Inspect the gate_status from gate-summary.json. If it is "failed", the verdict MUST be green: false with red_cause: "introduced", summarizing the failure causes.
      2. Qualitative Anti-AI Heuristic Audit:
         - Evaluate the PR description and commit notes against the Senior Human Contributor standard.
         - Prohibit em-dashes (—). Any em-dash in PR prose or commit messages is an instant failure.
         - Prohibit emojis of any kind.
         - Prohibit sycophantic greetings or conversational boilerplate (e.g. "We are pleased to introduce...", "In this PR...").
         - Prohibit repetitive bullet lists parroting file diffs or lecturing on well-known engine mechanics.
         - Ensure crisp, technical, direct prose explaining what and why.
      3. Capitalization & Structural Invariant:
         - Verify that the PR description begins with a capital letter.
      4. Synthesize Final Verdict:
         - If gate_status is "passed" AND all qualitative tone and style directives are satisfied:
           Emit green: true, red_cause: "", summary: "All deterministic checks and qualitative review passed clean."
         - If any qualitative rule is violated:
           Emit green: false, red_cause: "introduced", summary detailing the exact style violation.

      Output must strictly match the validation schema:
      {
        "green": boolean,
        "red_cause": "introduced" | "inherited" | "environment" | "",
        "summary": string
      }
